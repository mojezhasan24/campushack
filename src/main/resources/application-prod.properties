# PostgreSQL Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# H2 Console (Disabled in Prod)
spring.h2.console.enabled=false

# JPA / Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Cloudflare R2 / AWS S3 Configuration
aws.s3.endpointUrl=${S3_ENDPOINT_URL}
aws.s3.region=${S3_REGION:auto}
aws.s3.accessKeyId=${S3_ACCESS_KEY_ID}
aws.s3.secretAccessKey=${S3_SECRET_ACCESS_KEY}
aws.s3.bucketName=${S3_BUCKET_NAME}
aws.s3.publicUrlPrefix=${S3_PUBLIC_URL_PREFIX}

# Actuator Endpoints (Health Only)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# Logging (Structured JSON for production)
logging.level.root=INFO
logging.level.com.hackathon=INFO
